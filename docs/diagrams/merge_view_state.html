<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>合体｜見せ方の切替（状態図）</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f5f5f5; font-family: 'Geist', 'Hiragino Sans', sans-serif; color: #2d3142; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { font-family: 'Instrument Serif', 'Hiragino Mincho ProN', serif; font-weight: 400; font-size: 28px; margin: 0 0 4px; }
  .eyebrow { font-family: 'Geist Mono', 'Hiragino Sans', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #7a8399; }
  svg { width: 100%; height: auto; display: block; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">FiNANCiE TIMES Web · 合体 v3.2.0 · 状態図</div>
  <h1>見せ方の切替：出来高の箱を例に</h1>
  <svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vs-title vs-desc" font-family="'Geist', 'Hiragino Sans', sans-serif">
    <title id="vs-title">出来高の箱の見せ方の状態図</title>
    <desc id="vs-desc">出来高の箱は画面に入るまで描かない。画面に入ると既定の「上位Nの積み上げ」か、記憶した見せ方で描く。見せ方の釦で「束の積み上げ（月次）」「合計＋7日平均」「取引のあったPJ数」へ移る。期間・欠測・上位N・テーマを変えても見せ方は変わらず、同じ見せ方で描き直す。</desc>
    <defs>
      <marker id="vs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="vs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>
    <rect width="900" height="440" fill="#f5f5f5"/>

    <!-- 遷移（先に描く） -->
    <line x1="66" y1="200" x2="96" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vs-arrow)"/>
    <line x1="256" y1="200" x2="336" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#vs-arrow-accent)"/>
    <path d="M516,180 L568,180 Q576,180 576,172 L576,84 Q576,76 584,76 L640,76" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vs-arrow)"/>
    <line x1="516" y1="200" x2="640" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vs-arrow)"/>
    <path d="M516,220 L556,220 Q564,220 564,228 L564,316 Q564,324 572,324 L640,324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vs-arrow)"/>
    <path d="M396,160 C396,112 456,112 456,160" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#vs-arrow)"/>

    <!-- 遷移のラベル -->
    <g font-family="'Geist Mono', 'Hiragino Sans', monospace" font-size="8" text-anchor="middle">
      <rect x="268" y="180" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="296" y="189" fill="#eb6c36">画面に入る</text>
      <rect x="588" y="56" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="610" y="65" fill="#4f5d75">束を押す</text>
      <rect x="580" y="180" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="606" y="189" fill="#4f5d75">合計を押す</text>
      <rect x="580" y="304" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="606" y="313" fill="#4f5d75">PJ数を押す</text>
      <rect x="316" y="92" width="220" height="12" rx="2" fill="#f5f5f5"/><text x="426" y="101" fill="#4f5d75">期間・欠測・上位N・テーマ／同じ見せ方で描き直す</text>
    </g>

    <!-- 開始 -->
    <circle cx="60" cy="200" r="6" fill="#2d3142"/>

    <!-- 状態：未描画 -->
    <rect x="96" y="160" width="160" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
    <text x="176" y="200" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">未描画</text>
    <text x="176" y="216" font-size="8" fill="#4f5d75" text-anchor="middle">画面の外・データ未読込</text>

    <!-- 状態：上位Nの積み上げ（既定・焦点） -->
    <rect x="336" y="160" width="180" height="80" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
    <text x="344" y="176" font-size="8" fill="#eb6c36">既定</text>
    <text x="426" y="204" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">上位Nの積み上げ</text>
    <text x="426" y="220" font-size="8" fill="#4f5d75" text-anchor="middle">粒度 日／週／月・上位N＋その他</text>

    <!-- 状態：束の積み上げ（月次） -->
    <rect x="640" y="40" width="220" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="750" y="72" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">束の積み上げ（月次）</text>
    <text x="750" y="88" font-size="8" fill="#4f5d75" text-anchor="middle">粒度は月に固定・30日出来高のピック</text>

    <!-- 状態：合計＋7日平均 -->
    <rect x="640" y="164" width="220" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="750" y="196" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">合計＋7日平均</text>
    <text x="750" y="212" font-size="8" fill="#4f5d75" text-anchor="middle">日次の棒と線・内訳なし</text>

    <!-- 状態：取引のあったPJ数 -->
    <rect x="640" y="288" width="220" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="750" y="320" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">取引のあったPJ数</text>
    <text x="750" y="336" font-size="8" fill="#4f5d75" text-anchor="middle">週＝期末を末尾にした7日</text>

    <!-- 補足 -->
    <g font-size="8" fill="#7a8399">
      <text x="96" y="268">記憶（ft_view_volume）があれば、画面に入ったときにその見せ方から始まる</text>
      <text x="96" y="282">どの見せ方からも、押した釦の見せ方へ移る（逆向きの矢印は省略）</text>
    </g>

    <!-- 凡例 -->
    <line x1="24" y1="384" x2="876" y2="384" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
    <g font-size="8" fill="#4f5d75">
      <text x="24" y="404">オレンジ＝既定の見せ方と、最初に描くとき　・点線＝見せ方は変えずに描き直す</text>
      <text x="24" y="424">ほかの箱：シェア＝円（既定）⇄推移⇄束／ランキング＝表（既定）⇄上位8の今と前／価格＝円（既定）⇄指数・選び方 出来高上位（既定）⇄価格上位／メンバー＝純増（既定）⇄水準</text>
    </g>
  </svg>
</div>
</body>
</html>
