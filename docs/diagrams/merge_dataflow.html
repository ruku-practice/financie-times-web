<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>合体｜データの流れ</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f5f5f5; font-family: 'Geist', 'Hiragino Sans', sans-serif; color: #2d3142; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { font-family: 'Instrument Serif', 'Hiragino Mincho ProN', serif; font-weight: 400; font-size: 28px; margin: 0 0 4px; }

</head>
<body>
<div class="wrap">
  <div class="eyebrow">FiNANCiE TIMES Web · 合体 v3.2.0 · データの流れ</div>
  <h1>集計を1本にし、ブラウザは共通の状態から2つの描画部品を動かす</h1>
  <svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="md-title md-desc" font-family="'Geist', 'Hiragino Sans', sans-serif">
    <title id="md-title">合体後のデータの流れ</title>
    <desc id="md-desc">毎晩の収集で history.json を更新し、build_overview.py が名寄せと月次・束を含めて data/overview の静的JSONを1系統で作る。ブラウザの js/merged.js がJSONを1回だけ読み、期間・粒度・上位・欠測・テーマ・縦横の共通の状態を持つ。overview.js と analysis.js はその状態で箱ごとに描き、読む人は見せ方の釦と期間を操作する。</desc>
    <defs>
      <marker id="md-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/></marker>

      <marker id="md-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="728" height="356" fill="#f5f5f5"/>
    <rect x="0" y="36" width="728" height="80" fill="#2d3142" fill-opacity="0.018"/>

      <line x1="140" y1="36" x2="140" y2="276"/>
    </g>
    <g font-family="'Geist Mono', 'Hiragino Sans', monospace" text-anchor="middle">
      <rect x="180" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="196" y="17" font-size="8" fill="#2d3142">01</text><text x="196" y="29" font-size="8" fill="#4f5d75">収集</text>
      <rect x="292" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="308" y="17" font-size="8" fill="#2d3142">02</text><text x="308" y="29" font-size="8" fill="#4f5d75">集計（1本）</text>
      <rect x="404" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="420" y="17" font-size="8" fill="#2d3142">03</text><text x="420" y="29" font-size="8" fill="#4f5d75">配信</text>
      <rect x="516" y="6" width="32" height="16" rx="8" fill="#eb6c36" fill-opacity="0.20"/><text x="532" y="17" font-size="8" fill="#eb6c36">04</text><text x="532" y="29" font-size="8" fill="#eb6c36">共通の状態</text>
      <rect x="628" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="644" y="17" font-size="8" fill="#2d3142">05</text><text x="644" y="29" font-size="8" fill="#4f5d75">描く・読む</text>
    </g>
    <g font-family="'Geist Mono', 'Hiragino Sans', monospace" font-size="8" fill="#4f5d75" text-anchor="middle" letter-spacing="0.06em">

      <text x="70" y="152">ブラウザ</text><text x="70" y="164">JS/MERGED.JS</text>
      <text x="70" y="232">読む人</text><text x="70" y="244">ルク・読者</text>
    </g>

      <path d="M470,76 L520,76 Q528,76 528,84 L528,124" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#md-arr-accent)"/>

      <rect x="150" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="159" y="56" font-size="6" font-weight="600" fill="#2d3142">BAT</text>
      <text x="196" y="67" font-size="9" font-weight="600" fill="#2d3142">毎晩0:13 収集</text>
      <text x="196" y="79" font-size="6.5" fill="#4f5d75">409PJ × 価格・出来高・メンバー</text>
      <text x="196" y="91" font-size="6.5" fill="#7a8399">update_daily.py → history.json</text>

      <rect x="258" y="44" width="100" height="64" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.35"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="271" y="56" font-size="6" font-weight="600" fill="#2d3142">BAT</text>
      <text x="308" y="67" font-size="9" font-weight="600" fill="#2d3142">集計を1本に</text>
      <text x="308" y="79" font-size="6.5" fill="#4f5d75">名寄せ3組→406PJ・月次・束</text>
      <text x="308" y="91" font-size="6.5" fill="#7a8399">build_overview.py</text>

      <rect x="370" y="44" width="100" height="64" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.35"/>
      <rect x="374" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="383" y="56" font-size="6" font-weight="600" fill="#2d3142">BAT</text>
      <text x="420" y="67" font-size="9" font-weight="600" fill="#2d3142">静的配信</text>
      <text x="420" y="79" font-size="6.5" fill="#4f5d75">data/overview/*.json</text>

      <rect x="482" y="124" width="100" height="64" rx="4" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="#eb6c36" fill-opacity="0.18"/><text x="495" y="136" font-size="6" font-weight="600" fill="#eb6c36">WEB</text>
      <text x="532" y="147" font-size="9" font-weight="600" fill="#2d3142">1回だけ読む＋状態</text>
      <text x="532" y="159" font-size="6.5" fill="#4f5d75">期間・粒度・上位・欠測・テーマ</text>
      <text x="532" y="171" font-size="6.5" fill="#7a8399">merged.js・URL と記憶</text>

      <rect x="594" y="124" width="100" height="64" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.35"/>
      <rect x="598" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="607" y="136" font-size="6" font-weight="600" fill="#2d3142">WEB</text>
      <text x="644" y="147" font-size="9" font-weight="600" fill="#2d3142">箱ごとに描く</text>
      <text x="644" y="159" font-size="6.5" fill="#4f5d75">overview.js＋analysis.js</text>
      <text x="644" y="171" font-size="6.5" fill="#7a8399">見せ方で canvas を切替</text>

      <rect x="594" y="204" width="100" height="64" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.35"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="607" y="216" font-size="6" font-weight="600" fill="#2d3142">USR</text>
      <text x="644" y="227" font-size="9" font-weight="600" fill="#2d3142">読む・切り替える</text>
      <text x="644" y="239" font-size="6.5" fill="#4f5d75">結論→出来高→…→メンバー</text>
      <text x="644" y="251" font-size="6.5" fill="#7a8399">期間帯1つ・見せ方は箱ごと</text>
    </g>
    <g font-family="'Geist Mono', 'Hiragino Sans', monospace" font-size="7" fill="#4f5d75">
      <line x1="24" y1="292" x2="44" y2="292" stroke="#4f5d75" stroke-width="1" marker-end="url(#md-arr-muted)"/><text x="50" y="295">通常の受け渡し</text>
      <line x1="150" y1="292" x2="170" y2="292" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#md-arr-muted)"/><text x="176" y="295">操作（期間・見せ方・欠測）</text>
      <line x1="320" y1="292" x2="340" y2="292" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#md-arr-accent)"/><text x="346" y="295">焦点＝静的JSONを1か所で読む</text>
      <line x1="520" y1="292" x2="540" y2="292" stroke="#2e5aa8" stroke-width="1" marker-end="url(#md-arr-link)"/><text x="546" y="295">画面に出る</text>
      <text x="24" y="316" fill="#7a8399">本家 financie.jp へはバッチだけが触る。ブラウザは自サイトの静的 JSON しか読まない（v3.0.0 と同じ線引き）。</text>
      <text x="24" y="330" fill="#7a8399">data/analysis は廃止して data/overview に寄せる。「ならす／記録どおり」はブラウザで切り替える（再取得なし）。</text>
    </g>
