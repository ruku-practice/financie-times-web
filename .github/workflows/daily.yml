name: Daily Update

on:
  repository_dispatch:
    types: [run-daily-update]
  schedule:
    # 2026-07-27: Cloud Run（無料枠の255%超過・本Jobだけで全体の72%）から GitHub Actions へ移設。
    # 公開リポなので Actions の実行時間は無制限・無料。
    #
    # 主: 15:13 UTC = 0:13 JST。毎時ちょうどは混雑するため 13分ずらしている。
    # 保険: 18:00 UTC = 3:00 JST。GitHub はスケジュール実行を遅延させるだけでなく
    #       混雑時に丸ごと落とすことがあるため保険を残す。
    #       主が完走していればガード(check)が本日分ありと判定して25秒で帰る＝二重更新は起きない。
    # 実測(n=14): cron指定に対し平均76分遅れ（最小64・最大104）だが発火率は14/14。
    #             FiNANCiE は優先度が高くないため「毎日確実に動くなら時刻はずれてよい」（ルク判断 2026-07-27）。
    - cron: "13 15 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "本日分が既にあっても強制実行する"
        required: false
        default: false
        type: boolean
      test_mode:
        description: "スクレイピングのみ（スプレッドシート書き込みをスキップ）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: financie-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 実処理は約92分（スクレイプ29.8分＋シート書き込み40分＋その他22分／最大140分）。
    # 120分だと3回リトライが一度も機能しない（92分＋120秒＋92分で確実に超過）。
    # 公開リポは実行時間が無料なので伸ばさない理由がない。
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if already updated today (JST)
        id: check
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          LAST=$(python -c "import json; print(json.load(open('data/history_meta.json')).get('latest_collected',{}).get('date',''))" 2>/dev/null || echo "")
          echo "today(JST)=$TODAY / latest_collected=$LAST"
          if [ "$FORCE_RUN" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "▶ force=true のため強制実行します。"
          elif [ "$LAST" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "✅ 本日($TODAY)は既に更新済み。以降のステップをスキップします。"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "▶ 本日($TODAY)は未更新。実行します。"
          fi

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        if: steps.check.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Write service account credentials
        if: steps.check.outputs.run == 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > service_account.json
          echo "wrote service_account.json ($(wc -c < service_account.json) bytes)"

      - name: Run daily update (retry on failure only)
        if: steps.check.outputs.run == 'true'
        env:
          GOOGLE_CREDENTIALS_PATH: ${{ github.workspace }}/service_account.json
          PYTHONUNBUFFERED: "1"
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == true }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "$TEST_MODE" = "true" ]; then
            ARGS="--test"
          fi
          for attempt in 1 2 3; do
            echo "===== 試行 $attempt/3 ====="
            if python scripts/update_daily.py $ARGS; then
              echo "✅ 試行 $attempt で成功"
              exit 0
            fi
            echo "⚠ 試行 $attempt が失敗しました"
            if [ "$attempt" -lt 3 ]; then
              echo "120秒待機して再試行します..."
              sleep 120
            fi
          done
          echo "❌ 3回とも失敗しました"
          exit 1
      - name: Remove service account credentials
        if: always()
        run: rm -f service_account.json

      # test_mode は「シート書き込みをスキップする」だけで、data/ 配下のJSONは全部上書きされる。
      # 無条件に git add data/ すると検証のつもりが公開リポにpushされてサイトに反映されるため、
      # test_mode のときは commit/push ごと行わない（ランナーごと破棄される）。
      - name: Commit and push changes
        if: steps.check.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test_mode == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし（push スキップ）"
          else
            git commit -m "chore: daily data update ($(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%MJST))"
            # metadata.yml がほぼ同時刻に data/ をpushするため、rebaseしないと弾かれる
            git pull --rebase --autostash origin main
            git push
          fi